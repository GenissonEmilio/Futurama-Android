name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/tests -DFUT_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build portable core and tests
        run: cmake --build build/tests --target fut_portable_tests fut_SaveStorage_tests fut_ResourceLifetime_tests fut_FilesystemSafety_tests fut_TextureConversion_tests -j2
      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;30.0.16248370' 'cmake;3.31.6'
      - name: Build debug APK without game data
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Check packaged libraries and absence of disc data
        run: python3 tools/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK 16 KB alignment
        run: "$ANDROID_HOME/build-tools/35.0.0/zipalign -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Futurama-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
